name: face_recognition_flutter
description: Offline face recognition and liveness detection Flutter plugin for Android and iOS, supporting face enrollment, 1:1 verification, and face management.
version: 1.0.0
homepage: https://github.com/FaceAISDK/FaceAISDK_Flutter_Plugin
repository: https://github.com/FaceAISDK/FaceAISDK_Flutter_Plugin
issue_tracker: https://github.com/FaceAISDK/FaceAISDK_Flutter_Plugin/issues

topics:
  - face-recognition
  - liveness-detection
  - face-verification
  - biometrics
  - offline

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.faceaisdk.flutter
        pluginClass: FaceRecognitionPlugin
      ios:
        pluginClass: FaceRecognitionPlugin
